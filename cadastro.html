<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="">
    <title>Cadastro</title>
</head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<body>

    <style>

    body { 
        overflow-x: hidden;
        max-height: 100px;
        overflow-y: auto;
    }
     #formPedido { 
    position: relative;
    top: -150vh; /* Ajustado de -150vh para 0 */
    width: 30%;
    margin: 0; /* Centraliza o formulário */
    gap: 0px;
    display: flex;
    justify-content: center;
    flex-direction: column;
    
}

 .acailogooficial { 
       display: none;
    }

        .entrega {
            position: relative;
            display: block;
            top: 10vh;
            font-size: 20px;
            font-family: 'homanege',sans-serif;
        }

        input { 
            border: 2px solid purple;
            border-radius: 4px;
            padding: 8px 2px 8px 0px;
            width: 45vw;
            justify-content: left;
            display: flex;
            align-items: left;
      

        }

        img { 
            
            border-left: 3px solid #FF8902;
            top: -20vh;
            height: 50% ;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            width: 50%;
            position: relative;
            margin-left: auto;
            right: -2vw;
        }

        h3 {
            color: #9B9B9B ;
            margin-bottom: 0;
            padding: 0;
             font-size: 10px;
            font-family: 'homanege',sans-serif;
        }

        #pagamento { 
           
        margin-top: 10vh;
            border-radius: 8px;
           padding: 3px 3px 3px 3px;
          
           display: block;
           
        }
          .orientacao { 

            font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: purple;
            font-size: 18px;


        }

        
        button { 
            display: flex;
            margin-top: 10px;
          background-color: #6d0083;
color: white;
border-radius: 11px;
border: 3px solid #FF8902;
padding: 15px 45px 15px 45px;
        }
    
        @media (max-width: 425px) {
            body { 
             
        overflow-x: hidden;
        min-height: 100vh;
        
    }

    .acailogooficial { 
       display: flex;
        height: auto;
    }
      #formPedido {
        left: 8vw;
        position: relative;
        top: 20vh;
        width: 92%;
        max-width: none;
        margin: 20px auto;
    }

    img {
        display: none;
        width: 50%;
        margin: 5px auto;
        display: none;
        right: 0;
        top: 0;
        border: none;
        margin-bottom: 0px;    }

    .entrega {
        text-align: center;
        font-size: 18px;
    }


        input { 
        
            padding: 8px 2px 8px 0px;
            justify-content: center;
            display: flex;
            align-items: center;
      

color: white;
border-radius: 11px;
border: 3px solid #af02ff;
padding: 15px 45px 15px 45px;
        }

      

         #pagamento { 
           position: relative;
           left: -8vw;
margin-top: 0;
            border-radius: 8px;
           padding: 3px 3px;
           margin-bottom: 10px;
           display: flex;
          
        }

        
        button { 
            margin: 0 auto;
            justify-content: flex-start;
            display: flex;
           font-weight: bold;
          position:relative;
          left:-8vw;
           
            
          background-color: #6d0083;
color: white;
border-radius: 11px;
border: 3px solid #FF8902;
padding: 15px 45px 15px 45px;
        }
    }
    


    </style>

   
<img class="acailogooficial" src="logoaçai.png" alt="açai zero grau cadastro">

    <h1 class="entrega">INFORMAÇÕES PARA ENTREGA</h1>
    

    <img src="fotopedido.png" alt="">
    <div class="line"></div>
    

    
 <form id="formPedido">
    <h3>Nome & Sobrenome</h3>
    <input type="text" id="nome" placeholder="Nome & Sobrenome" required>
    <h3></h3>
    <!-- <input type="text" id="sobrenome" placeholder="Sobrenome" required> -->
    <h3>CPF</h3>
    <input type="text" id="cpf" placeholder="CPF" required>
    <h3>Cep</h3>
    <input type="text" id="cep" placeholder="CEP" required>
    <h3>Endereço</h3>
    <input type="text" id="endereco" placeholder="Endereço" required>
    <h3>Número</h3>
    <input type="text" id="numero" placeholder="Número" required>
    <h3>Complemento</h3>
    <input type="text" id="complemento" placeholder="Complemento">
    <h3>WhatsApp</h3>
    <input type="text" id="whatsapp" placeholder="WhatsApp" required>

    <h2 class="orientacao"> Selecione a Forma de Pagamento! Aceitamos Dinhero, Cartão e Pix </h2>
    <select id="pagamento">
        <option value="Pix">Pix</option>
        <option value="Cartão">Cartão</option>
        <option value="Dinheiro">Dinheiro</option>
    </select>

   <button type="submit">Continuar para Confirmação</button>
</form>

<script>

  
 document.getElementById('formPedido').addEventListener('submit', function(e) {
     e.preventDefault();

     const dadosCliente = {
         nome: document.getElementById('nome').value,
         whatsapp: document.getElementById('whatsapp').value,
         endereco: document.getElementById('endereco').value,
         numero: document.getElementById('numero').value,
        complemento: document.getElementById('complemento').value || "Não informado",
        pagamento: document.getElementById('pagamento').value
     };

     localStorage.setItem('dadosCliente', JSON.stringify(dadosCliente));
     window.location.href = 'confirmarpedidio.html';
 });




</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Informe seus dados para entrega do pedido.">
    <title>Dados para entrega | Açaí Zero Grau</title>
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="checkout.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase.js" defer></script>
    <script src="auth.js" defer></script>
    <script src="checkout.js" defer></script>
</head>
<body class="checkout-page" data-checkout-page="customer">
    <header class="checkout-header">
        <a href="index.html" aria-label="Página inicial">
            <img class="checkout-brand" src="logoaçai.png" alt="Açaí Zero Grau">
        </a>
        <a href="carrinho.html">Voltar ao carrinho</a>
    </header>

    <main class="checkout-main">
        <div class="checkout-heading">
            <h1>Informações para entrega</h1>
            <p>Revise ou complete seus dados. Eles ficarão salvos no seu perfil para facilitar próximos pedidos.</p>
        </div>

        <section class="checkout-card">
            <form class="checkout-form" id="form-cliente">
                <div class="checkout-field checkout-field-wide">
                    <label for="nome">Nome completo</label>
                    <input id="nome" name="nome" autocomplete="name" required>
                </div>
                <div class="checkout-field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>
                <div class="checkout-field">
                    <label for="whatsapp">WhatsApp com DDD</label>
                    <input id="whatsapp" name="whatsapp" type="tel" autocomplete="tel" required>
                </div>
                <div class="checkout-field">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" inputmode="numeric" autocomplete="off" required>
                </div>
                <div class="checkout-field">
                    <label for="cep">CEP</label>
                    <input id="cep" name="cep" inputmode="numeric" autocomplete="postal-code" required>
                </div>
                <div class="checkout-field checkout-field-wide">
                    <label for="endereco">Endereço</label>
                    <input id="endereco" name="endereco" autocomplete="street-address" required>
                </div>
                <div class="checkout-field">
                    <label for="numero">Número</label>
                    <input id="numero" name="numero" autocomplete="address-line2" required>
                </div>
                <div class="checkout-field">
                    <label for="complemento">Complemento (opcional)</label>
                    <input id="complemento" name="complemento" autocomplete="off">
                </div>
                <div class="checkout-field checkout-field-wide">
                    <label for="pagamento">Forma de pagamento</label>
                    <select id="pagamento" name="pagamento" required>
                        <option value="Pix">Pix</option>
                        <option value="Cartão">Cartão</option>
                        <option value="Dinheiro">Dinheiro</option>
                    </select>
                </div>
                <p class="checkout-message checkout-field-wide" id="checkout-message" role="status" aria-live="polite"></p>
                <div class="checkout-actions checkout-field-wide">
                    <button class="checkout-button" type="submit">Revisar pedido</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>

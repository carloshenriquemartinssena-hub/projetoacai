<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cadastro.html">
    <title>Confirmar Pedido</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
</head>
<body>

    <style>

        .container-confirmacao {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Divide em 2 colunas iguais */
    gap: 40px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
    font-family: sans-serif;
}

.card {
    background: #f9f9f9;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 20px;
}

/* Estilo das Imagens */
.produto-principal img {
    width: 100%;
    max-height: 400px;
    object-fit: cover;
    border-radius: 12px;
}

.outros-produtos {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

.outros-produtos img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 6px;
    border: 2px solid #ddd;
}

/* Botões */
.btn-confirmar {
    width: 100%;
    background: #28a745;
    color: white;
    padding: 15px;
    border: none;
    border-radius: 8px;
    font-size: 1.2rem;
    cursor: pointer;
    margin-top: 20px;
}

.btn-voltar {
    background: none;
    border: none;
    color: #666;
    text-decoration: underline;
    cursor: pointer;
}

#exibir-total { 
    color: purple;
}

#exibir-info { 
    color: purple;
}

strong {
    color: black;
}
    </style>

 <div class="container-confirmacao">
    <section class="coluna-info">
        <h2>Resumo do Pedido</h2>
        
        <div id="dados-cliente" class="card">
            <h3>Seus Dados</h3>
            <div id="exibir-info"></div> </div>

        <div class="pagamento-total card">
            <p><strong>Forma de Pagamento:</strong> <span id="exibir-pagamento"></span></p>
            <div class="total-box">
                <span>Total a pagar:</span>
                <strong id="exibir-total">R$ 0,00</strong>
            </div>
        </div>

        <button onclick="window.history.back()" class="btn-voltar">← Voltar e Corrigir</button>
    </section>

    <section class="coluna-produto">
        <div id="display-produtos">
            </div>
        
        <button id="finalizar-pedido" class="btn-confirmar">Confirmar Pedido</button>
    </section>
</div>


<script>
 // Recupera dados do localStorage
const cliente = JSON.parse(localStorage.getItem('dadosCliente'));
const produto = JSON.parse(localStorage.getItem('produtoSessao'));

const displayInfo = document.getElementById('exibir-info');
const displayProduto = document.getElementById('display-produtos');

if (cliente && produto) {
    displayInfo.innerHTML = `
        <p><strong>Nome:</strong> ${cliente.nome}</p>
        <p><strong>WhatsApp:</strong> ${cliente.whatsapp}</p>
        <p><strong>Endereço:</strong> ${cliente.endereco}, nº ${cliente.numero}</p>
        <p><strong>Complemento:</strong> ${cliente.complemento || ''}</p>
    `;
    document.getElementById('exibir-pagamento').innerText = cliente.pagamento;
    document.getElementById('exibir-total').innerText = produto.valor;

    displayProduto.innerHTML = `
        <div class="produto-principal">
            <img src="${produto.foto}" alt="${produto.nome}">
            <h3>${produto.nome}</h3>
            <p>Pedido preparado com açaí premium.</p>
        </div>
    `;
} else {
    displayProduto.innerHTML = "<h3 style='color:red'>Nenhum produto selecionado. Volte e escolha um!</h3>";
}

// Envio para o Supabase e WhatsApp
const formulario = document.getElementById('finalizar-pedido');

formulario.addEventListener('click', async function(event) { 
    event.preventDefault();

    if (!cliente || !produto) {  
        alert("Erro ao recuperar dados do pedido.");
        return;
    }

    // Trava botão contra duplo clique
    formulario.disabled = true;
    formulario.innerText = "Enviando Pedido...";

    // Converte "R$ 25,00" para número (25.00)
    const valorNumerico = Number(
        String(produto.valor)
            .replace("R$", "")
            .replace(/\./g, "")
            .replace(",", ".")
            .trim()
    );

    // Envio para o Supabase
    const { data, error } = await supabaseClient
        .from('Banco de clientes')
        .insert([
            {
                "Nome": cliente.nome,
                "Telefone": cliente.whatsapp,
                "Endereço": `${cliente.endereco}, nº ${cliente.numero}`,
                "Itens": {
                    produto: produto.nome,
                    foto: produto.foto,
                    valor: produto.valor
                },
                "Valor_total": valorNumerico,
                "Forma_pagamento": cliente.pagamento,
                "Status": "novo",
                "Observação": cliente.complemento || ""
            }
        ])
        

    if (error) {
        console.error("ERRO COMPLETO DO SUPABASE:", error);
        alert(`Erro ao salvar no banco (${error.code}): ${error.message}`);
        
        formulario.disabled = false;
        formulario.innerText = "Finalizar pedido";
        return;
    }

  localStorage.removeItem('produtoSessao');

    // 7. Oculta o botão e exibe a mensagem de sucesso na tela para o cliente
    const containerFormulario = formulario.parentElement || document.body;
    
    // Substitui a área do botão ou exibe o aviso com destaque
    formulario.style.display = 'none'; // Esconde o botão

    const mensagemSucesso = document.createElement('div');
    mensagemSucesso.style.backgroundColor = '#22c55e'; // Verde de sucesso
    mensagemSucesso.style.color = '#ffffff';
    mensagemSucesso.style.padding = '20px';
    mensagemSucesso.style.borderRadius = '8px';
    mensagemSucesso.style.textAlign = 'center';
    mensagemSucesso.style.marginTop = '20px';
    mensagemSucesso.style.fontWeight = 'bold';
    mensagemSucesso.style.fontSize = '18px';
    mensagemSucesso.innerHTML = `
        <h2 style="margin: 0 0 10px 0; font-size: 22px;">PEDIDO REALIZADO!</h2>
        <p style="margin: 0; font-weight: normal; font-size: 16px;">
            Você será notificado pelo Whatsapp sobre o seu pedido em instantes.
        </p>
    `;

    containerFormulario.appendChild(mensagemSucesso);
});

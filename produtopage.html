
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Confira nosso cardápio de açaí e monte seu pedido.">
    <title>Produto | Açaí Zero Grau</title>

    <link rel="stylesheet" href="produtopage.css">
    <link rel="stylesheet" href="site-chrome.css">

    <!-- Fontes originais -->
    <link href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Holtwood+One+SC&family=Homenaje&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Holtwood+One+SC&family=Homenaje&display=swap" rel="stylesheet">
</head>

<body>

<div data-store-header></div>


<!-- Banner promocional -->
<section class="carousel-section">
    <picture>
        <source media="(max-width: 425px)" srcset="bannerMB.png">
        <img src="banner.DK.png" alt="Promoções da Açaí Zero Grau">
    </picture>
</section>

<main class="produto-container">

    <p id="mensagem-produto" role="status" aria-live="polite"></p>

    <!-- PRODUTO: estrutura reutilizada para todos os itens -->
    <section class="produto-detalhes" id="produto-detalhes">
        
 <h1 class="produto-titulo" id="produto-titulo">
            Carregando produto...
        </h1>
        

        <!-- Galeria -->
        <div class="produto-galeria">

            <div class="imagem-principal">
                <img
                    id="imagem-produto-principal"
                    src="fotoexemplo.png"
                    alt="Foto do açaí">
            </div>

            <div
                class="imagens-miniaturas"
                id="imagens-miniaturas"
                aria-label="Fotos do produto">
            </div>

        </div>
       

        <!-- Informações e compra -->
       

            <form class="produto-opcoes" id="form-produto">

                <div class="opcao-grupo">
                    <label class="opcao-label" for="quantidade">
                        Quantidade:
                    </label>

                    <div class="seletor-quantidade">
                        <button
                            type="button"
                            class="qtd-btn"
                            id="btn-menos"
                            aria-label="Diminuir quantidade">
                            −
                        </button>

                        <input
                            type="number"
                            id="quantidade"
                            value="1"
                            min="1"
                            max="99"
                            step="1"
                            inputmode="numeric"
                            aria-label="Quantidade de unidades">

                        <button
                            type="button"
                            class="qtd-btn"
                            id="btn-mais"
                            aria-label="Aumentar quantidade">
                            +
                        </button>
                    </div>
                </div>

                <div class="opcao-grupo">
                    <span class="opcao-label">Escolha o tamanho:</span>

                    <div class="tamanhos-botoes" id="tamanhos-botoes"></div>
                </div>

                <p class="produto-preco" id="produto-preco"></p>

                <p class="produto-descricao" id="produto-descricao"></p>

                <div class="opcao-grupo">
                    <span class="opcao-label">Adicionais (opcional):</span>
                    <div id="adicionais-produto"></div>
                </div>

                <div class="opcao-grupo">
                    <label class="opcao-label" for="observacao-produto">
                        Observação (opcional):
                    </label>
                    <textarea
                        id="observacao-produto"
                        name="observacao"
                        rows="3"
                        maxlength="300"
                        placeholder="Ex.: sem granola ou pouco leite condensado"></textarea>
                </div>

                <div class="opcao-grupo">
                    <span class="opcao-label">Adicione ao carrinho ou finalize:</span>
                    <div class="botoes-principais">

                        <button
                            type="button"
                            class="btn-carrinho"
                            id="btn-carrinho">
                            Adicionar ao Carrinho
                        </button>

                        <button
                            type="submit"
                            class="btn-comprar">
                            Finalizar compra
                        </button>

                    </div>
                </div>

                <p id="mensagem-carrinho" role="status" aria-live="polite"></p>

            </form>

        </div>

    </section>

    <!-- Produtos semelhantes -->
    <section
        class="produtos-semelhantes"
        aria-labelledby="titulo-semelhantes">

        <h2 class="card-preco" id="titulo-semelhantes">
            Você também pode gostar:
        </h2>

        <div class="grid-semelhantes" id="grid-semelhantes"></div>

    </section>

</main>

<!-- Rodapé -->
<div data-store-footer></div>

<script src="produto.js" defer></script>
<script src="site-chrome.js" defer></script>
<script src="busca-produtos.js" defer></script>
<script src="produtopage.js" defer></script>

</body>
</html>
